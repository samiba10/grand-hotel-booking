site_name: Grand Hotel Booking Platform
site_description: Microservices hotel booking - architecture, security, auditing, pricing, performance
repo_url: https://github.com/samiba10/grand-hotel-booking
theme:
  name: material
  features: [navigation.sections, content.code.copy]
  palette:
    - scheme: default
      toggle: { icon: material/brightness-7, name: Dark mode }
    - scheme: slate
      toggle: { icon: material/brightness-4, name: Light mode }
markdown_extensions:
  - admonition
  - tables
  - toc: { permalink: true }
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
nav:
  - Home: index.md
  - Demo video: demo.md
  - Getting started: getting-started.md
  - Architecture: architecture.md
  - Security (AuthN / AuthZ / RBAC): security.md
  - Auditing: auditing.md
  - Pricing & FX: pricing-and-fx.md
  - API: api.md
  - Testing & coverage: testing.md
  - Performance: performance.md
  - Deployment (CI/CD): deployment.md
  - Time management: time-management.md
  - Decisions: decisions.md
  - Changelog: changelog.md
