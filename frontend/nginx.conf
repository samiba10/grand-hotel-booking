server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self'; frame-ancestors 'none'" always;

    # Same-origin API -> gateway: no CORS in this topology. Client IP for the rate limiter.
    location /api/ {
        proxy_pass http://gateway-service:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        client_max_body_size 1m;
    }

    # Hashed assets can be cached forever; index.html never.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA routing: unknown paths fall back to index.html
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
