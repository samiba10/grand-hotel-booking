server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: booking-service

app:
  booking:
    hotel-id: 1
    # What pricing-service + fx-service can quote. Which of these are OFFERED, the default, and
    # region -> currency are runtime system settings (ADMIN, /api/settings).
    priceable-currencies: [USD, ILS]
  clients:
    pricing:
      url: ${PRICING_URL:http://localhost:8083}
      timeout: PT3S
# No public paths: every endpoint requires a valid JWT.
